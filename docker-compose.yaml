services:
  minio:
    image: rustfs/rustfs:latest
    container_name: wazuh-minio
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_ACCESS_KEY: ${MINIO_ROOT_USER}
      RUSTFS_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data
    networks: [internal]
    restart: unless-stopped

  minio-init:
    image: amazon/aws-cli:latest
    container_name: wazuh-minio-init
    depends_on:
      - minio
    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      AWS_DEFAULT_REGION: us-east-1
    networks: [internal]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until aws --endpoint-url http://minio:9000 s3 ls >/dev/null 2>&1; do
          echo "en attente du stockage S3..."; sleep 2
        done
        aws --endpoint-url http://minio:9000 s3api create-bucket --bucket dashboard-data || true
        aws --endpoint-url http://minio:9000 s3api put-bucket-policy --bucket dashboard-data \
          --policy '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":"*","Action":["s3:GetObject"],"Resource":["arn:aws:s3:::dashboard-data/*"]}]}'
    restart: "no"

  postgres:
    image: postgres:16-alpine
    container_name: wazuh-vuln-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vuln_tracking}
      POSTGRES_USER: ${POSTGRES_USER:-vuln_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vuln_app} -d ${POSTGRES_DB:-vuln_tracking}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  vuln-api:
    build: ./backend
    container_name: wazuh-vuln-api
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8000 --workers 4
    env_file: [.env]
    environment:
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET_DASHBOARD: dashboard-data
    volumes:
      - ./backend/src:/app/src
      - ./backend/config:/app/config
      - ./backend/alembic:/app/alembic
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    networks: [internal]
    restart: unless-stopped

  wazuh-report:
    build: ./backend
    container_name: wazuh-report-weekly
    env_file: [.env]
    environment:
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET_DASHBOARD: dashboard-data
    command: python main.py --only all
    volumes:
      - ./backend/src:/app/src
      - ./backend/config:/app/config
      - ./backend/main.py:/app/main.py
      - ./backend/templates:/app/templates
      - ./logs:/app/logs
      - ./backend/static:/app/static
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    networks: [internal]
    restart: "no"

  frontend-web:
    build: ./frontend
    container_name: wazuh-frontend-web
    ports:
      - "127.0.0.1:8088:80"
    depends_on: [minio, vuln-api]
    networks: [internal]
    restart: unless-stopped

networks:
  internal:
    driver: bridge

volumes:
  postgres-data:
  minio-data:
